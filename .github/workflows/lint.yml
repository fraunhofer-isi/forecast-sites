name: lint

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: extract python version
        uses: ./.github/actions/extract-python-version
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install dependencies
        run: |
          # also see settings in pyproject.toml
          # No pipe here: `pip install ... | grep -v` makes the step exit with
          # grep's status, which reports a failed install as success.
          pip install --quiet .[dev]
      - name: format
        run: |
          # --check so the job verifies formatting instead of silently rewriting
          # files. A CI job must never mutate the tree; otherwise it passes while
          # the committed code stays unformatted.
          ruff format --check
      - name: lint
        run: |
          ruff check --output-format github
