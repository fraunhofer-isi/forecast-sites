name: web_lint

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: extract node version
      uses: ./.github/actions/extract-node-version
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: install dependencies
      run: |  
        cd web
        npm install
    - name: web_lint
      run: | 
        cd web
        mkdir eslint
        npm run lint