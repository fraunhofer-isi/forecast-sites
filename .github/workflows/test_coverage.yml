# AI-assisted code generation was used during development.

name: coverage

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: extract python version
      uses: ./.github/actions/extract-python-version
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: install dependencies
      run: |
        # also see settings in pyproject.toml
        # No pipe here: `pip install ... | grep -v` makes the step exit with
        # grep's status, which reports a failed install as success.
        pip install --quiet .[dev]
    - name: test
      # pipefail so a failing pytest is not masked by `tee` succeeding.
      # Without it the step exits with tee's status and failing tests pass CI.
      shell: bash
      run: |
        set -o pipefail
        mkdir -p ./pytest
        python -m pytest --cov | tee ./pytest/coverage.log
        # Prefer pytest-cov's precise "Total coverage: NN.NN%" line; the TOTAL
        # table row is rounded to whole percent. Fall back to the row when the
        # summary line is absent, and fail loudly rather than publishing 0.
        PYTEST_COVERAGE=$(sed -n 's/.*Total coverage: \([0-9.]*\)%.*/\1/p' ./pytest/coverage.log | tail -1)
        if [ -z "$PYTEST_COVERAGE" ]; then
          PYTEST_COVERAGE=$(awk '$1 == "TOTAL" {gsub(/%/,"",$NF); print $NF}' ./pytest/coverage.log)
        fi
        if [ -z "$PYTEST_COVERAGE" ]; then
          echo "Could not parse coverage from ./pytest/coverage.log; refusing to publish a bogus badge."
          exit 1
        fi
        echo "PYTEST_COVERAGE=$PYTEST_COVERAGE" >> $GITHUB_ENV
        echo "Pytest coverage is $PYTEST_COVERAGE"
    - name: badge
      # Fork pull requests get no repository secrets, so the gist update would
      # always fail there. Badges are only meaningful for the main branch anyway.
      if: github.event_name != 'pull_request'
      uses: schneegans/dynamic-badges-action@v1.9.0
      with:
        # The Variables GIST_SECRET and GIST_Id need to be stored in the GitHub repository secrets
        # If you do not have a Gist, you can create one at https://gist.github.com/
        auth: ${{ secrets.GIST_SECRET }}
        gistID: ${{ secrets.GIST_ID }}
        filename: forecast-sites_test_coverage.json
        label: coverage
        message: ${{ env.PYTEST_COVERAGE }}
        valColorRange: ${{ env.PYTEST_COVERAGE }}
        maxColorRange: 100
        minColorRange: 0
