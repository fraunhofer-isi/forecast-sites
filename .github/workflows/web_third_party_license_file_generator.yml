# AI-assisted code generation was used during development.

name: web_third_party_license_file_generation

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: update branch before generation
      # Avoid rebasing generated output over concurrent edits to the license file.
      if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
      run: |
        git pull --rebase --autostash
    - name: extract node version
      uses: ./.github/actions/extract-node-version
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: extract python version
      uses: ./.github/actions/extract-python-version
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: install dependencies
      run: |       
        cd web
        npm install
    - name: third party license file generation
      run: |
        python check/generate_web_thirdparty_license_file.py
    - name: fail if the committed file is stale
      # Pull requests, especially from forks, verify generated output without
      # trying to push a commit back to the contributor's branch.
      if: github.event_name == 'pull_request'
      run: |
        if ! git diff --quiet -- web/THIRDPARTY.md; then
          echo "web/THIRDPARTY.md is out of date. Run the web third-party license generator and commit the result."
          git --no-pager diff -- web/THIRDPARTY.md
          exit 1
        fi
    - name: push changes
      # Do not let bot-triggered runs start another write-back.
      if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: updated third party license file for web
