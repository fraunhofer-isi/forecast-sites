# AI-assisted code generation was used during development.

name: third_party_license_file_generation

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: extract python version
      uses: ./.github/actions/extract-python-version
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: install dependencies
      run: |
        pip install .[license]
    - name: generate third party license file
      run: |
        python check/generate_thirdparty_license_file.py
    - name: Update branch before commit
      run: |
        git pull --rebase --autostash origin main
    - name: push changes
      # also see https://github.com/stefanzweifel/git-auto-commit-action
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: updated third party license file
